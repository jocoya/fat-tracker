<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>產生 App 圖示</title>
<style>
  body{font-family:-apple-system,"PingFang TC",sans-serif;background:#f5f5f7;padding:30px;text-align:center}
  canvas{margin:10px;border:1px solid #ddd;border-radius:12px;background:#fff}
  button{padding:10px 18px;border:none;background:#0a84ff;color:#fff;border-radius:10px;font-size:15px;cursor:pointer;margin:6px}
</style>
</head>
<body>
  <h2>減脂計畫 圖示產生器</h2>
  <p>按下按鈕會下載 icon-192.png 和 icon-512.png，放到專案資料夾即可。</p>
  <div>
    <canvas id="c192" width="192" height="192"></canvas>
    <canvas id="c512" width="512" height="512"></canvas>
  </div>
  <button onclick="dl(192)">下載 192</button>
  <button onclick="dl(512)">下載 512</button>
  <button onclick="dl(192);dl(512)">兩個都下載</button>

<script>
function draw(cv){
  const s = cv.width, ctx = cv.getContext('2d'), k = s/512;
  // 背景
  const bg = ctx.createLinearGradient(0,0,0,s);
  bg.addColorStop(0,'#ffffff'); bg.addColorStop(1,'#e8e8ed');
  const r = 114*k;
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(0,0,s,s,r); ctx.fill();
  // 灰環
  ctx.lineWidth = 34*k; ctx.strokeStyle = '#d8d8dd';
  ctx.beginPath(); ctx.arc(s/2,s/2,138*k,0,Math.PI*2); ctx.stroke();
  // 進度環
  const grad = ctx.createLinearGradient(0,0,s,s);
  grad.addColorStop(0,'#5ac8fa'); grad.addColorStop(1,'#0a84ff');
  ctx.strokeStyle = grad; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(s/2,s/2,138*k,-Math.PI/2,Math.PI*1.05); ctx.stroke();
  // 勾
  ctx.strokeStyle='#30d158'; ctx.lineWidth=30*k; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(212*k,250*k); ctx.lineTo(246*k,284*k); ctx.lineTo(310*k,206*k);
  ctx.stroke();
}
function dl(size){
  const cv = document.getElementById('c'+size);
  const a = document.createElement('a');
  a.download = 'icon-'+size+'.png';
  a.href = cv.toDataURL('image/png');
  a.click();
}
draw(document.getElementById('c192'));
draw(document.getElementById('c512'));
</script>
</body>
</html>
